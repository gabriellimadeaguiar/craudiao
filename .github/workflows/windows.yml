# Compila o ExitLag Analyzer (Qt Quick + Qt Quick 3D) para Windows e publica dois artefatos:
#   ExitLagAnalyzer-Setup  · um único instalador .exe (Inno Setup), o que se distribui
#   ExitLagAnalyzer-windows · a pasta pronta para rodar sem instalar
# Roda a cada push que mexe em qt/ e também pelo botão "Run workflow" na aba Actions.
name: Windows build

on:
  push:
    paths:
      - 'qt/**'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt 6.8
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtquick3d qtshadertools qtquicktimeline'
          cache: true

      - name: MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: cmake -S qt -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release

      - name: Package (windeployqt)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/ExitLagAnalyzer.exe dist/
          # sem opengl32sw (fallback de OpenGL por software, ~20 MB: o app usa Direct3D 11) e sem formatos de imagem
          # que o app não usa
          windeployqt --release --qmldir qt/qml --no-translations --no-compiler-runtime --no-opengl-sw `
            --exclude-plugins qgif,qicns,qico,qtga,qtiff,qwbmp,qwebp,qpdf dist/ExitLagAnalyzer.exe
          # runtime do Visual C++ ao lado do .exe (deploy app-local): roda em PC sem o vc_redist e sem administrador
          $crt = Get-ChildItem "$env:VCToolsRedistDir\x64" -Directory -Filter "Microsoft.VC*.CRT" | Select-Object -First 1
          if (-not $crt) { throw "Visual C++ runtime not found in $env:VCToolsRedistDir" }
          Copy-Item "$($crt.FullName)\*.dll" dist/
          Copy-Item qt/README.md dist/README.md

      # medição de desempenho no Windows (sem GPU no runner: Direct3D por software, WARP). Os números servem para
      # comparar builds (memória, CPU da interface, tempo até o primeiro quadro), não como o que um PC com GPU faz.
      - name: Performance smoke test
        continue-on-error: true
        timeout-minutes: 5
        shell: pwsh
        run: |
          $scenes = @("entry", "home/game", "home/opt", "netmap")
          foreach ($s in $scenes) {
            $log = "perf-" + ($s -replace '[/:]', '_') + ".log"
            $p = Start-Process -FilePath dist/ExitLagAnalyzer.exe -ArgumentList "--scene=$s", "--power=full", "--perf=$PWD\$log", "--quit-after=12000" -PassThru
            if (-not $p.WaitForExit(40000)) { $p.Kill() }
            Write-Host "== $s"; if (Test-Path $log) { Get-Content $log | Select-Object -Last 4 }
          }
          Get-ChildItem dist -Recurse | Measure-Object -Property Length -Sum | ForEach-Object { "dist size: {0:N1} MB" -f ($_.Sum / 1MB) }

      - name: Upload performance logs
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: perf-logs
          path: perf-*.log
          if-no-files-found: ignore

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = (Get-Command iscc.exe -ErrorAction SilentlyContinue).Source
          if (-not $iscc) { $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress; $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" }
          $ver = (Select-String -Path qt/CMakeLists.txt -Pattern 'project\(ExitLagAnalyzer VERSION ([0-9.]+)').Matches[0].Groups[1].Value
          & $iscc /Q "/DAppVersion=$ver" "/DSourceDir=$PWD\dist" "/DOutputDir=$PWD\installer-out" qt/installer/ExitLagAnalyzer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed ($LASTEXITCODE)" }
          Get-ChildItem installer-out

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: ExitLagAnalyzer-Setup
          path: installer-out/ExitLagAnalyzer-Setup.exe
          if-no-files-found: error

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: ExitLagAnalyzer-windows
          path: dist
          if-no-files-found: error
